[project]
name = "fasteth"
version = "1.0.13"
description = "A lightweight, python native, async interface for the Ethereum JSON RPC."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Tony Valentine", email = "tvalentine@dedaub.com" },
    { name = "0xAlcibiades", email = "info@dontemail.com" },
]
requires-python = ">=3.10,<4"
dependencies = [
    "httpx[http2]>=0.16",
    "eth-typing>=5.0.0,<6",
    "eth-utils==5.3.1",
    "pydantic==2.14.1",
    "orjson>=3.5.1,<4",
    "setuptools>=65.6.3,<66",
    "pycryptodome>=3.17,<4", # need this since eth-utils wont install a backend for eth-hash
]

[dependency-groups]
dev = [
    "pytest>=7.0,<8",
    "pytest-asyncio>=0.20.3,<0.21",
    "pytest-benchmark>=4.0.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
